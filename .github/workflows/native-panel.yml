name: Native panel
on:
  push:
    branches: [native-panel]
    paths: ['packages/purge-panel/**', '.github/workflows/native-panel.yml']
  pull_request:
    paths: ['packages/purge-panel/**', '.github/workflows/native-panel.yml']
  workflow_dispatch:
permissions:
  contents: read
# 같은 ref 에 새 실행이 오면 이전 실행을 취소한다(연속 푸시로 런이 겹치지 않게).
concurrency:
  group: native-panel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/purge-panel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/purge-panel/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run format:check
      - run: npm test
      - run: npm pack --ignore-scripts
