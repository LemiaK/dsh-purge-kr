name: LLM smoke test

# Environment `localization` 의 LLM_API_KEY 로 실제 번역 요청을 한 번 보내 본다.
# 결과(번역문)는 로그에 남지만 키는 남지 않는다.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "번역해 볼 중국어 문자열(비우면 기본 샘플)"
        required: false
        default: ""
      text_b64:
        description: "긴 문자열용: 중국어를 base64 로 인코딩해 넣는다(text 보다 우선)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: localization
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_DEBUG: "1"
      LLM_SESSION_ID: ${{ vars.LLM_SESSION_ID || github.run_id }}
      LLM_EXTRA_HEADERS: ${{ vars.LLM_EXTRA_HEADERS }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Call the model once
        env:
          INPUT_TEXT: ${{ inputs.text }}
          INPUT_B64: ${{ inputs.text_b64 }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_B64}" ]; then
            text="$(printf '%s' "${INPUT_B64}" | base64 -d)"
            node scripts/i18n-smoke.mjs "${text}"
          elif [ -n "${INPUT_TEXT}" ]; then
            node scripts/i18n-smoke.mjs "${INPUT_TEXT}"
          else
            node scripts/i18n-smoke.mjs
          fi
      - name: Never print the key
        if: always()
        run: |
          if [ -n "${LLM_API_KEY:-}" ]; then echo "key present (value hidden)"; else echo "key missing"; fi
